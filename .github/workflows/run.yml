name: run-service
on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: run-service
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile
        run: javac "Main.java"
      - name: Run
        run: |
          timeout 20100 bash -c 'while true; do java Main; echo "restart in 5s"; sleep 5; done'
